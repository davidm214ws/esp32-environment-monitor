<text x="760" y="260" fill="white" font-size="28" font-family="Arial" font-weight="bold">BME280</text>
<text x="735" y="289" fill="#e7fbf7" font-size="17" font-family="Arial">I²C breakout module</text>
<text x="125" y="293" fill="white" font-size="21" font-family="Arial">3V3</text><circle cx="425" cy="285" r="9" fill="#d94c4c"/><path d="M 434 285 H 680" stroke="#d94c4c" stroke-width="6" fill="none"/><circle cx="680" cy="285" r="9" fill="#d94c4c"/><text x="715" y="293" fill="white" font-size="21" font-family="Arial">VIN / 3V3</text><text x="125" y="363" fill="white" font-size="21" font-family="Arial">GND</text><circle cx="425" cy="355" r="9" fill="#34465e"/><path d="M 434 355 H 680" stroke="#34465e" stroke-width="6" fill="none"/><circle cx="680" cy="355" r="9" fill="#34465e"/><text x="715" y="363" fill="white" font-size="21" font-family="Arial">GND</text><text x="125" y="433" fill="white" font-size="21" font-family="Arial">GPIO21 / SDA</text><circle cx="425" cy="425" r="9" fill="#2486c5"/><path d="M 434 425 H 680" stroke="#2486c5" stroke-width="6" fill="none"/><circle cx="680" cy="425" r="9" fill="#2486c5"/><text x="715" y="433" fill="white" font-size="21" font-family="Arial">SDA</text><text x="125" y="503" fill="white" font-size="21" font-family="Arial">GPIO22 / SCL</text><circle cx="425" cy="495" r="9" fill="#c17a18"/><path d="M 434 495 H 680" stroke="#c17a18" stroke-width="6" fill="none"/><circle cx="680" cy="495" r="9" fill="#c17a18"/><text x="715" y="503" fill="white" font-size="21" font-family="Arial">SCL</text><text x="84" y="580" font-family="Arial" font-size="17" fill="#52657b">Use 3.3V-safe BME280 breakout; verify the module's exact pinout before connecting power.</text></svg>